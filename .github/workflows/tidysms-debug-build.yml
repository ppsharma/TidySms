name: TidySMS Phase 1 validation

on:
  workflow_dispatch:
  push:
    branches:
      - development/phase-1-intelligent-inbox
      - development/phase-1-thread-classification

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run classifier unit tests
        run: ./gradlew --no-daemon testFossDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleFossDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TidySMS-debug-APK
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 14
